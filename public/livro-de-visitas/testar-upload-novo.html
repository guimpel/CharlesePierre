<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Teste temporário de anexo</title><body style="background:#000;color:#f4c025;font:16px Arial;padding:40px"><h1>Teste técnico de armazenamento privado</h1><p>Somente para homologação. Nunca publicar.</p><button id="test" style="padding:15px">ENVIAR TESTE ÚNICO PNG</button><pre id="out"></pre><script>
document.getElementById('test').addEventListener('click',async function(){
 this.disabled=true;
 const out=document.getElementById('out');
 try {
  const canvas=document.createElement('canvas');canvas.width=4;canvas.height=4;
  canvas.getContext('2d').fillRect(0,0,4,4);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  const fd=new FormData();
  fd.set('nome','TESTE PNG SUPABASE NOVO NAO PUBLICAR');
  fd.set('cidade','Teste Interno');
  fd.set('depoimento','Verificacao automatica de anexo privado em 13 novembro 2026, NAO PUBLICAR.');
  fd.set('autorizacao','sim');
  fd.set('arquivo_1',new File([blob],'teste-4px.png',{type:'image/png'}));
  const r=await fetch('https://syexhhoeynolwqdehvjv.supabase.co/functions/v1/memorias-api',{method:'POST',body:fd});
  const j=await r.json();
  out.textContent='HTTP '+r.status+'\n'+JSON.stringify(j,null,2);
 }catch(e){out.textContent='ERRO '+String(e);}
});
</script></body></html>
